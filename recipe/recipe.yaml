context:
  version: "2.7.3"

package:
  name: watchexec
  version: ${{ version }}

source:
  url: https://github.com/watchexec/watchexec/archive/v${{ version }}.tar.gz
  sha256: 6f395178a963ffd478f0ee2e13146d375e8bbe4fec6859a56a0086a90e07e6f2

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - watchexec --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Execute commands when watched files change
  homepage: https://github.com/watchexec/watchexec
  repository: https://github.com/watchexec/watchexec

extra:
  recipe-maintainers:
    - danielnachun
